<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OnlyFunds — MT5 Trading Dashboard</title>

    <!-- Favicon + PWA icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icon.svg" color="#60a5fa" />

    <!-- PWA manifest + theme color (drives iOS standalone status bar too) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#212327" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" (not translucent): translucent reports a top inset yet still
         sizes the view to screen-minus-status-bar, wasting an equal band at
         the bottom. Measured 402x812 in a 402x874 screen, insets 62/34. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="OnlyFunds" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Kanit:wght@300;400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
