<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Background — matches dashboard --bg-primary -->
  <rect width="16" height="16" fill="#0f172a"/>

  <!-- Outer pixel-art frame in accent cyan (subtle bezel) -->
  <rect x="0" y="0" width="16" height="1" fill="#38bdf8"/>
  <rect x="0" y="15" width="16" height="1" fill="#38bdf8"/>
  <rect x="0" y="0" width="1" height="16" fill="#38bdf8"/>
  <rect x="15" y="0" width="1" height="16" fill="#38bdf8"/>

  <!-- Block "D" — pixel-art -->
  <g fill="#38bdf8">
    <rect x="3" y="3"  width="6" height="2"/>
    <rect x="3" y="11" width="6" height="2"/>
    <rect x="3" y="3"  width="2" height="10"/>
    <rect x="9" y="4"  width="2" height="8"/>
    <rect x="10" y="5" width="1" height="6"/>
  </g>

  <!-- Trailing ":" accent (echoes the DOI :: motif) -->
  <g fill="#22c55e">
    <rect x="12" y="6" width="1" height="1"/>
    <rect x="12" y="9" width="1" height="1"/>
  </g>
</svg>
