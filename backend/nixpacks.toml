providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
dependsOn = ["install"]
cmds = [
  "DATABASE_URL='postgresql://dummy:dummy@localhost:5432/dummy' npx prisma generate",
  "npm run build",
]

[start]
cmd = "npx prisma db push --accept-data-loss --skip-generate && npx tsx prisma/seed.ts && node dist/index.js"
