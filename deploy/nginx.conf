# OnlyFunds — Nginx config
# setup.sh copies this to /etc/nginx/sites-available/onlyfunds and replaces
# __DOMAIN__ with your real domain (or the server IP).
# Certbot adds the SSL server block automatically afterwards.

server {
    listen 80;
    server_name __DOMAIN__;

    # Frontend — static files built by `npm run build`
    root /opt/onlyfunds/frontend/dist;
    index index.html;

    # EA pushes can carry 500+ closed deals; express accepts 2mb, so must nginx.
    client_max_body_size 5m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets only — index.html must stay uncached or browsers
    # keep loading the old bundle after a deploy.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # EA downloads — served straight from the build output
    location /ea/ {
        add_header Content-Disposition "attachment";
    }

    # Backend API — proxy to Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket — live dashboard updates
    location /ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
